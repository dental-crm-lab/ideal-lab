name: Build Windows app

# Builds the IDEAL Lab desktop app (.exe) on a real Windows runner —
# no local Windows machine or wine needed. Run it manually from the
# Actions tab ("Run workflow"), or it fires automatically whenever
# electron/ changes on main. The finished installer + portable exe
# are attached as a downloadable build artifact.

on:
  push:
    branches: [main]
    paths: ['electron/**']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: electron
        run: npm install
      - name: Build Windows installer + portable exe
        working-directory: electron
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: IDEAL-Lab-Windows
          path: |
            electron/dist/*.exe
          retention-days: 90
